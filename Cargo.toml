[package]
name = "cannon"
version = "2.2.0"
edition = "2021"
rust-version = "1.88"
description = "High-performance load testing for HTTP and raw TCP services"
readme = "README.md"
repository = "https://github.com/FelipeFelipeRenan/cannon-project"
homepage = "https://github.com/FelipeFelipeRenan/cannon-project"
keywords = ["load-testing", "benchmark", "http", "tcp", "performance"]
categories = ["command-line-utilities", "development-tools::testing", "network-programming"]
exclude = ["/.github", "/scripts", "/docs", "/install.sh"]
license = "MIT OR Apache-2.0"

[profile.release]
lto = true
codegen-units = 1
strip = true

[[bin]]
name = "cannon"
path = "src/main.rs"

[features]
# Everything on by default; build with `--no-default-features` for the smallest
# binary (HTTP and TCP load testing, JSON/CSV/baseline reports, nothing else).
default = ["update", "yaml", "html"]
update = ["dep:self_update"]   # `--update` (self-updating from GitHub releases)
yaml = ["dep:serde_yaml"]      # `--config file.yaml`
html = []                      # `--html report.html` (embeds Chart.js, ~200 KB)

[dependencies]
mimalloc = { version = "0.1", default-features = false }
# Pinned exactly: `allocator_tuning` in src/main.rs sets options by index.
libmimalloc-sys = { version = "=0.1.49", default-features = false, features = ["extended"] }
tokio = { version = "1.52.3", features = ["full"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "http2"] }
clap = { version = "4.6.1", features = ["derive"] }
hdrhistogram = "7.5.4"
indicatif = "0.18.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = { version = "0.9", optional = true }
url = "2.5.8"

colored = "3.1.1"
tabled = { version = "0.21.0", default-features = false, features = ["std"] }


async-channel = "2.3"
bytes = "1"

self_update = { version = "1.3.0", default-features = false, features = ["github", "reqwest", "progress-bar", "rustls", "archive-tar", "archive-zip", "tar", "zip"], optional = true }
itoa = "1.0.18"
fastrand = "2.4.1"
core_affinity = "0.8.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

