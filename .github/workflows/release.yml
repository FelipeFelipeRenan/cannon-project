name: Release Cannon

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify tag matches Cargo.toml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compare tag and crate version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          crate="$(grep -m1 '^version' Cargo.toml | cut -d '"' -f 2)"

          echo "tag=$tag crate=$crate"

          if [ "$tag" != "$crate" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $crate"
            exit 1
          fi

  build:
    name: Build ${{ matrix.asset_name }}
    needs: verify
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cannon-linux-x64
            binary: cannon

          - os: ubuntu-24.04-arm
            asset_name: cannon-linux-arm64
            binary: cannon

          - os: macos-15-intel
            asset_name: cannon-macos-x64
            binary: cannon

          - os: macos-latest
            asset_name: cannon-macos-arm64
            binary: cannon

          - os: windows-latest
            asset_name: cannon-windows-x64.exe
            binary: cannon.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: cargo test --locked --release

      - name: Build release
        run: cargo build --locked --release

      - name: Smoke test the binary
        shell: bash
        run: ./target/release/${{ matrix.binary }} --version

      - name: Prepare binary
        shell: bash
        run: |
          mv "target/release/${{ matrix.binary }}" "target/release/${{ matrix.asset_name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.asset_name }}
          if-no-files-found: error

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum cannon-* > SHA256SUMS

          echo "Generated checksums:"
          cat SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/cannon-*
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
