name: Release Cannon

on:
  push:
    tags:
      - "v*"
      - "*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: Build for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            asset_name: cannon-linux-x64

          - os: windows-latest
            asset_name: cannon-windows-x64.exe

          - os: macos-latest
            asset_name: cannon-macos-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Prepare Binary (Unix)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd target/release

          if [ -f "cannon" ]; then
            mv "cannon" "${{ matrix.asset_name }}"
          elif [ -f "cannon-project" ]; then
            mv "cannon-project" "${{ matrix.asset_name }}"
          else
            echo "❌ Error: No binary found in target/release"
            exit 1
          fi

      - name: Prepare Binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd target/release

          if [ -f "cannon.exe" ]; then
            mv "cannon.exe" "${{ matrix.asset_name }}"
          elif [ -f "cannon-project.exe" ]; then
            mv "cannon-project.exe" "${{ matrix.asset_name }}"
          else
            echo "❌ Error: No .exe found in target/release"
            exit 1
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: target/release/${{ matrix.asset_name }}

  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: |
          sha256sum cannon-linux-x64 \
                    cannon-macos-x64 \
                    cannon-windows-x64.exe \
            > SHA256SUMS

          echo "Generated checksums:"
          cat SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-assets/cannon-linux-x64
            release-assets/cannon-macos-x64
            release-assets/cannon-windows-x64.exe
            release-assets/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}